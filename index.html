<!doctype html>
<html lang="zh-Hant">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#f5f6f2">
  <title>日常帳本 — 訂閱與固定支出</title>
  <style>
    :root {
      color-scheme: light;
      --ink: #202820;
      --muted: #788078;
      --line: #e8ebe5;
      --paper: #fff;
      --canvas: #f5f6f2;
      --green: #2e694d;
      --green-dark: #214e39;
      --green-soft: #eaf2eb;
      --orange: #e6955d;
      --red: #bd5a4a;
      --shadow: 0 12px 40px rgb(34 49 37 / 8%);
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", "Noto Sans TC", sans-serif;
    }

    * { box-sizing: border-box; }
    body { margin: 0; background: var(--canvas); color: var(--ink); }
    button, input, select { font: inherit; }
    button { cursor: pointer; }
    .app { display: flex; min-height: 100vh; }
    .sidebar {
      display: flex; flex: 0 0 238px; flex-direction: column; padding: 28px 18px;
      border-right: 1px solid var(--line); background: #fbfcf9;
    }
    .brand { display: flex; align-items: center; gap: 11px; margin: 0 10px 49px; }
    .brand-mark {
      display: grid; width: 36px; height: 36px; place-items: center; border-radius: 12px;
      background: var(--green); color: white; font-size: 19px; font-weight: 700;
    }
    .brand-name { font-size: 16px; font-weight: 750; letter-spacing: .04em; }
    .nav-label { padding: 0 12px 12px; color: #a0a69e; font-size: 11px; font-weight: 700; letter-spacing: .12em; }
    .nav-item {
      display: flex; align-items: center; gap: 12px; margin: 2px 0; padding: 12px;
      border-radius: 10px; color: #697169; font-size: 14px; text-decoration: none;
    }
    .nav-item.active { background: var(--green-soft); color: var(--green-dark); font-weight: 650; }
    .nav-icon { display: inline-grid; width: 21px; place-items: center; font-size: 17px; }
    .sidebar-note { margin-top: auto; padding: 16px; border: 1px solid var(--line); border-radius: 14px; color: var(--muted); font-size: 12px; line-height: 1.7; }
    .sidebar-note strong { display: block; margin-bottom: 4px; color: var(--ink); font-size: 13px; }
    .main { width: min(100% - 238px, 1360px); margin: 0 auto; padding: 34px 46px 56px; }
    .topbar { display: flex; align-items: center; justify-content: space-between; gap: 20px; margin-bottom: 34px; }
    .eyebrow { margin-bottom: 7px; color: var(--muted); font-size: 12px; font-weight: 600; letter-spacing: .08em; }
    h1 { margin: 0; font-size: clamp(24px, 3vw, 31px); letter-spacing: -.04em; }
    .today { color: var(--muted); font-size: 13px; }
    .primary-btn {
      display: inline-flex; align-items: center; justify-content: center; gap: 8px; min-height: 43px;
      padding: 0 17px; border: 0; border-radius: 10px; background: var(--green); color: white;
      font-size: 13px; font-weight: 650; transition: background .15s, transform .15s;
    }
    .primary-btn:hover { transform: translateY(-1px); background: var(--green-dark); }
    .metrics { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 16px; margin-bottom: 19px; }
    .metric, .panel { border: 1px solid var(--line); border-radius: 15px; background: var(--paper); }
    .metric { min-height: 146px; padding: 20px 22px; }
    .metric-head { display: flex; align-items: center; justify-content: space-between; color: var(--muted); font-size: 12px; }
    .metric-icon { display: grid; width: 32px; height: 32px; place-items: center; border-radius: 10px; background: var(--green-soft); color: var(--green); font-size: 16px; }
    .metric-value { margin-top: 16px; font-size: 27px; font-weight: 720; letter-spacing: -.04em; }
    .metric-foot { margin-top: 5px; color: #969d95; font-size: 11px; }
    .content-grid { display: grid; grid-template-columns: minmax(0, 1.5fr) minmax(290px, .9fr); gap: 18px; margin-bottom: 18px; }
    .panel { padding: 21px 22px; }
    .panel-header { display: flex; align-items: flex-start; justify-content: space-between; gap: 15px; margin-bottom: 20px; }
    h2 { margin: 0; font-size: 15px; letter-spacing: -.02em; }
    .panel-subtitle { margin-top: 5px; color: var(--muted); font-size: 11px; }
    .period-select, .search, .filter-select {
      height: 35px; padding: 0 10px; border: 1px solid var(--line); border-radius: 8px;
      background: #fff; color: #606960; font-size: 12px;
    }
    .chart-area { display: flex; min-height: 199px; align-items: center; justify-content: center; gap: clamp(24px, 5vw, 55px); }
    .donut {
      position: relative; display: grid; width: 156px; height: 156px; flex: 0 0 156px;
      place-items: center; border-radius: 50%; background: conic-gradient(var(--line) 0deg 360deg);
    }
    .donut::after { position: absolute; width: 112px; height: 112px; border-radius: 50%; background: white; content: ""; }
    .donut-label { z-index: 1; text-align: center; }
    .donut-label strong { display: block; font-size: 20px; letter-spacing: -.04em; }
    .donut-label span { color: var(--muted); font-size: 10px; }
    .legend { display: grid; min-width: 128px; gap: 13px; }
    .legend-row { display: grid; grid-template-columns: 9px 1fr auto; align-items: center; gap: 8px; font-size: 11px; }
    .legend-dot { width: 8px; height: 8px; border-radius: 50%; }
    .legend-name { color: #657067; }
    .legend-value { color: var(--ink); font-weight: 650; }
    .upcoming-list { display: grid; gap: 4px; }
    .upcoming-item { display: flex; align-items: center; gap: 11px; padding: 10px 0; }
    .service-icon { display: grid; width: 38px; height: 38px; flex: 0 0 38px; place-items: center; border-radius: 12px; background: #f1f3ed; font-size: 17px; }
    .upcoming-info { min-width: 0; flex: 1; }
    .upcoming-name { overflow: hidden; font-size: 12px; font-weight: 650; text-overflow: ellipsis; white-space: nowrap; }
    .upcoming-date { margin-top: 4px; color: var(--muted); font-size: 10px; }
    .upcoming-amount { white-space: nowrap; font-size: 12px; font-weight: 650; }
    .due-pill { display: inline-block; margin-left: 5px; padding: 3px 6px; border-radius: 5px; background: #fff2e9; color: #b76d3f; font-size: 9px; font-weight: 600; }
    .table-panel { padding: 0; overflow: hidden; }
    .table-toolbar { display: flex; align-items: center; justify-content: space-between; gap: 15px; padding: 20px 22px; }
    .table-controls { display: flex; gap: 8px; }
    .search { width: 176px; }
    .table-wrap { overflow-x: auto; }
    table { width: 100%; border-collapse: collapse; text-align: left; }
    th { padding: 11px 22px; border-top: 1px solid #f0f1ed; border-bottom: 1px solid #f0f1ed; background: #fbfcfa; color: #939a92; font-size: 10px; font-weight: 600; white-space: nowrap; }
    td { padding: 13px 22px; border-bottom: 1px solid #f0f1ed; color: #59635a; font-size: 11px; white-space: nowrap; }
    tr:last-child td { border-bottom: 0; }
    .table-name { color: var(--ink); font-size: 12px; font-weight: 650; }
    .table-category { display: inline-flex; align-items: center; gap: 6px; }
    .status { padding: 4px 8px; border-radius: 20px; background: var(--green-soft); color: var(--green); font-size: 10px; }
    .status.paused { background: #f0f1ee; color: #818780; }
    .row-actions { display: flex; justify-content: flex-end; gap: 5px; }
    .icon-btn { width: 29px; height: 29px; border: 0; border-radius: 7px; background: transparent; color: #818980; font-size: 13px; }
    .icon-btn:hover { background: #f1f3ef; color: var(--green); }
    .icon-btn.delete:hover { background: #fff0ed; color: var(--red); }
    .empty { padding: 36px 20px; color: var(--muted); text-align: center; font-size: 12px; }
    .empty strong { display: block; margin-bottom: 6px; color: var(--ink); font-size: 13px; }
    .overlay { position: fixed; z-index: 5; inset: 0; display: grid; place-items: center; padding: 20px; background: rgb(26 36 28 / 42%); }
    .overlay[hidden] { display: none; }
    .dialog { width: min(100%, 470px); max-height: min(90vh, 760px); overflow-y: auto; padding: 25px; border-radius: 17px; background: #fff; box-shadow: var(--shadow); }
    .dialog-header { display: flex; align-items: flex-start; justify-content: space-between; margin-bottom: 21px; }
    .dialog-header h2 { font-size: 19px; }
    .dialog-header p { margin: 6px 0 0; color: var(--muted); font-size: 12px; }
    .close-btn { width: 32px; height: 32px; border: 0; border-radius: 9px; background: #f3f5f1; color: #667066; font-size: 18px; }
    .form-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 15px; }
    .field { display: grid; gap: 7px; }
    .field.full { grid-column: 1 / -1; }
    .field label { color: #556057; font-size: 11px; font-weight: 650; }
    .field input, .field select { width: 100%; height: 42px; padding: 0 11px; border: 1px solid #dfe4dc; border-radius: 8px; background: white; color: var(--ink); font-size: 13px; }
    .field input:focus, .field select:focus, .search:focus, .period-select:focus, .filter-select:focus { outline: 2px solid #bfd4c4; outline-offset: 1px; }
    .form-error { min-height: 17px; margin: 12px 0 0; color: var(--red); font-size: 11px; }
    .dialog-actions { display: flex; justify-content: flex-end; gap: 9px; margin-top: 11px; }
    .secondary-btn { min-height: 40px; padding: 0 14px; border: 1px solid var(--line); border-radius: 9px; background: white; color: #5e675f; font-size: 12px; }
    .dialog-actions .primary-btn { min-height: 40px; }
    .toast { position: fixed; right: 24px; bottom: 24px; z-index: 10; padding: 12px 16px; border-radius: 10px; background: #253e2e; color: white; box-shadow: var(--shadow); font-size: 12px; }
    .toast[hidden] { display: none; }
    @media (max-width: 1020px) {
      .sidebar { flex-basis: 205px; }
      .main { width: calc(100% - 205px); padding: 30px 26px; }
      .content-grid { grid-template-columns: 1fr; }
    }
    @media (max-width: 700px) {
      .app { display: block; }
      .sidebar { display: none; }
      .main { width: 100%; padding: 23px 16px 40px; }
      .topbar { align-items: flex-end; margin-bottom: 23px; }
      .today { display: none; }
      .topbar .primary-btn { min-height: 39px; padding: 0 12px; font-size: 11px; }
      .metrics { grid-template-columns: 1fr 1fr; gap: 10px; }
      .metric { min-height: 125px; padding: 15px; }
      .metric:last-child { grid-column: 1 / -1; min-height: 108px; }
      .metric-value { margin-top: 12px; font-size: 22px; }
      .content-grid { gap: 12px; }
      .panel { padding: 17px 15px; }
      .chart-area { min-height: 175px; gap: 20px; }
      .donut { width: 132px; height: 132px; flex-basis: 132px; }
      .donut::after { width: 96px; height: 96px; }
      .table-toolbar { align-items: flex-start; flex-direction: column; padding: 17px 15px; }
      .table-controls { width: 100%; }
      .search { min-width: 0; flex: 1; }
      th, td { padding-right: 13px; padding-left: 13px; }
    }
    @media (max-width: 390px) {
      .chart-area { gap: 13px; }
      .donut { width: 116px; height: 116px; flex-basis: 116px; }
      .donut::after { width: 84px; height: 84px; }
      .legend { min-width: 113px; }
    }
  </style>
</head>
<body>
  <div class="app">
    <aside class="sidebar">
      <div class="brand"><div class="brand-mark">日</div><div class="brand-name">日常帳本</div></div>
      <div class="nav-label">工作空間</div>
      <a class="nav-item active" href="#overview"><span class="nav-icon">▦</span>支出總覽</a>
      <a class="nav-item" href="#expenses"><span class="nav-icon">◷</span>固定支出</a>
      <div class="sidebar-note"><strong>小提醒</strong>定期檢視訂閱項目，讓每一筆固定支出都花得值得。</div>
    </aside>

    <main class="main" id="overview">
      <header class="topbar">
        <div>
          <div class="eyebrow">PERSONAL FINANCE</div>
          <h1>支出總覽</h1>
          <div class="today" id="today"></div>
        </div>
        <button class="primary-btn" id="add-expense"><span aria-hidden="true">＋</span> 新增支出</button>
      </header>

      <section class="metrics" aria-label="支出摘要">
        <article class="metric">
          <div class="metric-head"><span>每月固定支出</span><span class="metric-icon">↗</span></div>
          <div class="metric-value" id="monthly-total">$0</div>
          <div class="metric-foot">依付款週期換算的每月預估</div>
        </article>
        <article class="metric">
          <div class="metric-head"><span>年度預估支出</span><span class="metric-icon">▤</span></div>
          <div class="metric-value" id="annual-total">$0</div>
          <div class="metric-foot">以目前有效項目推估全年支出</div>
        </article>
        <article class="metric">
          <div class="metric-head"><span>即將扣款</span><span class="metric-icon">◷</span></div>
          <div class="metric-value" id="upcoming-total">0 筆</div>
          <div class="metric-foot" id="upcoming-caption">未來 30 天內的有效支出</div>
        </article>
      </section>

      <section class="content-grid">
        <article class="panel">
          <div class="panel-header">
            <div><h2>支出分類</h2><div class="panel-subtitle">依每月預估金額分布</div></div>
            <select class="period-select" aria-label="統計期間"><option>每月預估</option></select>
          </div>
          <div class="chart-area">
            <div class="donut" id="donut" role="img" aria-label="支出分類圓環圖">
              <div class="donut-label"><strong id="chart-total">$0</strong><span>每月預估</span></div>
            </div>
            <div class="legend" id="legend"></div>
          </div>
        </article>
        <article class="panel">
          <div class="panel-header">
            <div><h2>近期扣款</h2><div class="panel-subtitle">未來 30 天內的付款項目</div></div>
          </div>
          <div class="upcoming-list" id="upcoming-list"></div>
        </article>
      </section>

      <section class="panel table-panel" id="expenses">
        <div class="table-toolbar">
          <div><h2>固定支出</h2><div class="panel-subtitle">管理你的訂閱與定期付款</div></div>
          <div class="table-controls">
            <input id="search" class="search" type="search" placeholder="搜尋支出…" aria-label="搜尋支出">
            <select id="category-filter" class="filter-select" aria-label="依分類篩選">
              <option value="all">所有分類</option>
              <option>影音娛樂</option><option>軟體工具</option><option>生活服務</option><option>交通出行</option><option>其他</option>
            </select>
          </div>
        </div>
        <div class="table-wrap">
          <table>
            <thead><tr><th>項目</th><th>分類</th><th>金額</th><th>付款週期</th><th>下次扣款</th><th>狀態</th><th aria-label="操作"></th></tr></thead>
            <tbody id="expense-rows"></tbody>
          </table>
          <div class="empty" id="empty-state" hidden><strong>還沒有固定支出</strong>新增第一筆項目，開始掌握每月支出。</div>
        </div>
      </section>
    </main>
  </div>

  <div class="overlay" id="expense-dialog" hidden>
    <section class="dialog" role="dialog" aria-modal="true" aria-labelledby="dialog-title">
      <div class="dialog-header">
        <div><h2 id="dialog-title">新增固定支出</h2><p>記下定期付款，掌握每月支出。</p></div>
        <button class="close-btn" id="close-dialog" type="button" aria-label="關閉">×</button>
      </div>
      <form id="expense-form" novalidate>
        <div class="form-grid">
          <div class="field full"><label for="name">項目名稱</label><input id="name" name="name" maxlength="60" placeholder="例如：影音串流服務" required></div>
          <div class="field"><label for="amount">金額</label><input id="amount" name="amount" type="number" min="1" max="99999999" step="1" placeholder="0" required></div>
          <div class="field"><label for="category">分類</label><select id="category" name="category"><option>影音娛樂</option><option>軟體工具</option><option>生活服務</option><option>交通出行</option><option>其他</option></select></div>
          <div class="field"><label for="frequency">付款週期</label><select id="frequency" name="frequency"><option value="monthly">每月</option><option value="yearly">每年</option><option value="quarterly">每季</option><option value="weekly">每週</option><option value="biweekly">每兩週</option></select></div>
          <div class="field"><label for="nextDate">下次扣款日</label><input id="nextDate" name="nextDate" type="date" required></div>
        </div>
        <p class="form-error" id="form-error" role="alert"></p>
        <div class="dialog-actions">
          <button class="secondary-btn" id="cancel-dialog" type="button">取消</button>
          <button class="primary-btn" type="submit">儲存支出</button>
        </div>
      </form>
    </section>
  </div>
  <div class="toast" id="toast" role="status" aria-live="polite" hidden></div>

  <script>
    (() => {
      const STORAGE_KEY = "daily-ledger-expenses-v1";
      const categories = {
        "影音娛樂": { icon: "▶", color: "#5b8f72" },
        "軟體工具": { icon: "✳", color: "#e6955d" },
        "生活服務": { icon: "⌂", color: "#7d89bc" },
        "交通出行": { icon: "↗", color: "#d1b75c" },
        "其他": { icon: "•", color: "#a6aaa2" }
      };
      const frequencyLabels = { monthly: "每月", yearly: "每年", quarterly: "每季", weekly: "每週", biweekly: "每兩週" };
      const monthlyFactors = { monthly: 1, yearly: 1 / 12, quarterly: 1 / 3, weekly: 52 / 12, biweekly: 26 / 12 };
      const $ = (selector) => document.querySelector(selector);
      const dateToday = new Date();
      dateToday.setHours(0, 0, 0, 0);
      let expenses = loadExpenses();
      let editingId = null;
      let toastTimer;

      function loadExpenses() {
        try {
          const stored = localStorage.getItem(STORAGE_KEY);
          if (!stored) return [];
          const parsed = JSON.parse(stored);
          if (!Array.isArray(parsed)) throw new Error("Stored expense data is not a list.");
          return parsed.filter((item) =>
            item && typeof item.id === "string" && typeof item.name === "string" &&
            Number.isFinite(item.amount) && item.amount > 0 &&
            Object.hasOwn(categories, item.category) && Object.hasOwn(frequencyLabels, item.frequency) &&
            isValidDate(item.nextDate) && typeof item.active === "boolean"
          );
        } catch (error) {
          console.error("無法讀取已儲存的支出資料。", error);
          showToast("讀取資料失敗，請檢查瀏覽器儲存空間。");
          return [];
        }
      }

      function persist() {
        try {
          localStorage.setItem(STORAGE_KEY, JSON.stringify(expenses));
          return true;
        } catch (error) {
          console.error("無法儲存支出資料。", error);
          showToast("儲存失敗，請確認瀏覽器儲存空間可用。");
          return false;
        }
      }

      function isValidDate(value) {
        if (typeof value !== "string" || !/^\d{4}-\d{2}-\d{2}$/.test(value)) return false;
        const parsed = new Date(`${value}T00:00:00`);
        return !Number.isNaN(parsed.getTime()) && localDateString(parsed) === value;
      }

      function money(amount) {
        return new Intl.NumberFormat("zh-TW", {
          style: "currency", currency: "TWD", maximumFractionDigits: 0
        }).format(Math.round(amount));
      }

      function localDateString(date) {
        const year = date.getFullYear();
        const month = String(date.getMonth() + 1).padStart(2, "0");
        const day = String(date.getDate()).padStart(2, "0");
        return `${year}-${month}-${day}`;
      }

      function formatDate(value) {
        const date = new Date(`${value}T00:00:00`);
        return new Intl.DateTimeFormat("zh-TW", { month: "numeric", day: "numeric" }).format(date);
      }

      function addMonths(date, months) {
        const result = new Date(date);
        const originalDay = result.getDate();
        result.setDate(1);
        result.setMonth(result.getMonth() + months);
        const lastDay = new Date(result.getFullYear(), result.getMonth() + 1, 0).getDate();
        result.setDate(Math.min(originalDay, lastDay));
        return result;
      }

      function nextOccurrence(expense) {
        let date = new Date(`${expense.nextDate}T00:00:00`);
        while (date < dateToday) {
          if (expense.frequency === "weekly") date.setDate(date.getDate() + 7);
          else if (expense.frequency === "biweekly") date.setDate(date.getDate() + 14);
          else if (expense.frequency === "monthly") date = addMonths(date, 1);
          else if (expense.frequency === "quarterly") date = addMonths(date, 3);
          else date = addMonths(date, 12);
        }
        return date;
      }

      function escapeHtml(value) {
        return String(value).replace(/[&<>"']/g, (char) => ({
          "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;"
        })[char]);
      }

      function render() {
        const active = expenses.filter((item) => item.active);
        const monthlyTotal = active.reduce((sum, item) => sum + item.amount * monthlyFactors[item.frequency], 0);
        const upcoming = active.map((item) => ({ ...item, occurrence: nextOccurrence(item) }))
          .filter((item) => (item.occurrence - dateToday) / 86400000 <= 30)
          .sort((a, b) => a.occurrence - b.occurrence);

        $("#monthly-total").textContent = money(monthlyTotal);
        $("#annual-total").textContent = money(monthlyTotal * 12);
        $("#upcoming-total").textContent = `${upcoming.length} 筆`;
        $("#today").textContent = new Intl.DateTimeFormat("zh-TW", {
          year: "numeric", month: "long", day: "numeric", weekday: "long"
        }).format(dateToday);
        renderChart(active, monthlyTotal);
        renderUpcoming(upcoming);
        renderTable();
      }

      function renderChart(active, total) {
        const totals = Object.keys(categories).map((category) => ({
          category,
          amount: active.filter((item) => item.category === category)
            .reduce((sum, item) => sum + item.amount * monthlyFactors[item.frequency], 0)
        })).filter((item) => item.amount > 0).sort((a, b) => b.amount - a.amount);
        let angle = 0;
        const segments = totals.map((item) => {
          const start = angle;
          angle += total ? item.amount / total * 360 : 0;
          return `${categories[item.category].color} ${start}deg ${angle}deg`;
        });
        $("#donut").style.background = segments.length
          ? `conic-gradient(${segments.join(", ")})`
          : "conic-gradient(#e8ebe5 0deg 360deg)";
        $("#chart-total").textContent = money(total);
        $("#legend").innerHTML = totals.length ? totals.map((item) => `
          <div class="legend-row">
            <span class="legend-dot" style="background:${categories[item.category].color}"></span>
            <span class="legend-name">${item.category}</span>
            <span class="legend-value">${Math.round(item.amount / total * 100)}%</span>
          </div>`).join("") : '<div class="empty">新增支出後<br>查看分類分布</div>';
      }

      function renderUpcoming(items) {
        const list = $("#upcoming-list");
        if (!items.length) {
          list.innerHTML = '<div class="empty">未來 30 天沒有扣款項目</div>';
          return;
        }
        list.innerHTML = items.slice(0, 4).map((item) => {
          const days = Math.round((item.occurrence - dateToday) / 86400000);
          const due = days === 0 ? "今天" : days === 1 ? "明天" : `${days} 天後`;
          return `<div class="upcoming-item">
            <div class="service-icon">${categories[item.category].icon}</div>
            <div class="upcoming-info"><div class="upcoming-name">${escapeHtml(item.name)}</div>
            <div class="upcoming-date">${formatDate(localDateString(item.occurrence))}<span class="due-pill">${due}</span></div></div>
            <div class="upcoming-amount">${money(item.amount)}</div>
          </div>`;
        }).join("");
      }

      function renderTable() {
        const query = $("#search").value.trim().toLocaleLowerCase();
        const category = $("#category-filter").value;
        const filtered = expenses.filter((item) =>
          item.name.toLocaleLowerCase().includes(query) && (category === "all" || item.category === category)
        );
        $("#expense-rows").innerHTML = filtered.map((item) => `
          <tr>
            <td><span class="table-name">${escapeHtml(item.name)}</span></td>
            <td><span class="table-category"><span>${categories[item.category].icon}</span>${item.category}</span></td>
            <td>${money(item.amount)}</td>
            <td>${frequencyLabels[item.frequency]}</td>
            <td>${formatDate(item.nextDate)}</td>
            <td><span class="status ${item.active ? "" : "paused"}">${item.active ? "使用中" : "已暫停"}</span></td>
            <td><div class="row-actions">
              <button class="icon-btn" type="button" data-action="toggle" data-id="${item.id}" aria-label="${item.active ? "暫停" : "啟用"} ${escapeHtml(item.name)}">${item.active ? "Ⅱ" : "▶"}</button>
              <button class="icon-btn" type="button" data-action="edit" data-id="${item.id}" aria-label="編輯 ${escapeHtml(item.name)}">✎</button>
              <button class="icon-btn delete" type="button" data-action="delete" data-id="${item.id}" aria-label="刪除 ${escapeHtml(item.name)}">×</button>
            </div></td>
          </tr>`).join("");
        $("#empty-state").hidden = filtered.length !== 0;
        $("#expense-rows").closest("table").hidden = filtered.length === 0;
      }

      function openDialog(expense = null) {
        editingId = expense?.id ?? null;
        $("#expense-form").reset();
        $("#form-error").textContent = "";
        $("#dialog-title").textContent = expense ? "編輯固定支出" : "新增固定支出";
        $("#name").value = expense?.name ?? "";
        $("#amount").value = expense?.amount ?? "";
        $("#category").value = expense?.category ?? "影音娛樂";
        $("#frequency").value = expense?.frequency ?? "monthly";
        $("#nextDate").value = expense?.nextDate ?? localDateString(dateToday);
        $("#expense-dialog").hidden = false;
        $("#name").focus();
      }

      function closeDialog() {
        $("#expense-dialog").hidden = true;
        editingId = null;
      }

      function showToast(message) {
        const toast = $("#toast");
        toast.textContent = message;
        toast.hidden = false;
        clearTimeout(toastTimer);
        toastTimer = setTimeout(() => { toast.hidden = true; }, 2600);
      }

      $("#add-expense").addEventListener("click", () => openDialog());
      $("#close-dialog").addEventListener("click", closeDialog);
      $("#cancel-dialog").addEventListener("click", closeDialog);
      $("#expense-dialog").addEventListener("click", (event) => {
        if (event.target === $("#expense-dialog")) closeDialog();
      });
      document.addEventListener("keydown", (event) => {
        if (event.key === "Escape" && !$("#expense-dialog").hidden) closeDialog();
      });
      $("#search").addEventListener("input", renderTable);
      $("#category-filter").addEventListener("change", renderTable);

      $("#expense-form").addEventListener("submit", (event) => {
        event.preventDefault();
        const formData = new FormData(event.currentTarget);
        const name = String(formData.get("name") ?? "").trim();
        const amount = Number(formData.get("amount"));
        const nextDate = String(formData.get("nextDate") ?? "");
        if (!name || name.length > 60 || !Number.isFinite(amount) || amount <= 0 ||
            amount > 99999999 || !isValidDate(nextDate)) {
          $("#form-error").textContent = "請確認名稱、金額與扣款日期皆正確。";
          return;
        }
        const record = {
          id: editingId ?? (globalThis.crypto?.randomUUID?.() ?? `${Date.now()}-${Math.random().toString(16).slice(2)}`),
          name,
          amount,
          category: String(formData.get("category")),
          frequency: String(formData.get("frequency")),
          nextDate,
          active: editingId ? expenses.find((item) => item.id === editingId).active : true
        };
        if (editingId) expenses = expenses.map((item) => item.id === editingId ? record : item);
        else expenses = [...expenses, record];
        if (!persist()) return;
        closeDialog();
        render();
        showToast(editingId ? "支出已更新" : "支出已新增");
      });

      $("#expense-rows").addEventListener("click", (event) => {
        const button = event.target.closest("button[data-action]");
        if (!button) return;
        const item = expenses.find((expense) => expense.id === button.dataset.id);
        if (!item) return;
        if (button.dataset.action === "edit") openDialog(item);
        if (button.dataset.action === "toggle") {
          expenses = expenses.map((expense) => expense.id === item.id ? { ...expense, active: !expense.active } : expense);
          if (persist()) { render(); showToast(item.active ? "支出已暫停" : "支出已啟用"); }
        }
        if (button.dataset.action === "delete") {
          if (!window.confirm(`確定要刪除「${item.name}」嗎？`)) return;
          expenses = expenses.filter((expense) => expense.id !== item.id);
          if (persist()) { render(); showToast("支出已刪除"); }
        }
      });

      render();
    })();
  </script>
</body>
</html>
